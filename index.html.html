<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiki Reskianto Bugi</title>

<!-- Favicon dari logo KRB -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="description" content="Situs pribadi Kiki Reskianto Bugi, penulis esai dan peneliti independen dari Wamena, Papua Pegunungan.">
<meta name="author" content="Kiki Reskianto Bugi">
<meta name="robots" content="index, follow">
<meta property="og:type" content="profile">
<meta property="og:title" content="Kiki Reskianto Bugi">
<meta property="og:image" content="potret-utama.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">

<style>
/* ===================================================================
   TOKEN: nilai warna ditimpa dari data.js saat halaman dimuat
   =================================================================== */
:root{
  --tosca:#12A6A0; --tosca-tua:#0B6560; --tosca-muda:#8BE3DD;
  --hitam:#050A0A; --putih:#fff; --kertas:#EDF3F2;
  --merah:#B23A2E; --kuning:#D9A441;

  --sans:'Archivo','Helvetica Neue',Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;

  --lebar:1180px;
  --pad:clamp(1.25rem,5vw,3.5rem);
  --ruang:clamp(4.5rem,10vw,8rem);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
body{
  margin:0; background:var(--putih); color:var(--hitam);
  font-family:var(--serif); font-size:1.0625rem; line-height:1.72;
  font-optical-sizing:auto; -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--tosca); outline-offset:3px; border-radius:2px}

.batas{max-width:var(--lebar); margin-inline:auto; padding-inline:var(--pad)}
.lompat{position:absolute;left:-9999px;top:0;background:var(--tosca);color:#fff;padding:.7rem 1rem;z-index:200}
.lompat:focus{left:0}

/* ===================================================================
   NAVIGASI
   =================================================================== */
.puncak{
  position:fixed; inset:0 0 auto 0; z-index:100;
  display:flex; align-items:center; gap:1rem;
  padding:.85rem var(--pad);
  transition:background .3s ease, box-shadow .3s ease, padding .3s ease;
}
.puncak--tempel{background:rgba(5,10,10,.93); backdrop-filter:blur(10px); box-shadow:0 1px 0 rgba(255,255,255,.09)}
.tanda{display:flex; align-items:center; gap:.6rem; text-decoration:none; margin-right:auto}
.tanda img{width:38px; height:38px; border-radius:9px}
.tanda span{
  font-family:var(--sans); font-weight:700; font-stretch:118%;
  letter-spacing:.06em; font-size:.95rem; color:#fff;
}
.menu{display:flex; gap:.35rem; align-items:center}
.menu a{
  font-family:var(--sans); font-size:.855rem; font-weight:500; font-stretch:104%;
  text-decoration:none; color:rgba(255,255,255,.74);
  padding:.5rem .72rem; border-radius:999px; transition:color .2s, background .2s;
}
.menu a:hover{color:#fff; background:rgba(255,255,255,.1)}
.tombol-menu{display:none; background:none; border:1px solid rgba(255,255,255,.3); color:#fff;
  border-radius:8px; padding:.45rem .7rem; font-family:var(--sans); font-size:.8rem; cursor:pointer}

@media (max-width:820px){
  .menu{
    position:absolute; top:100%; right:var(--pad); left:var(--pad);
    flex-direction:column; align-items:stretch; gap:0;
    background:rgba(5,10,10,.97); border:1px solid rgba(255,255,255,.12);
    border-radius:14px; padding:.4rem; display:none;
  }
  .menu[data-buka="ya"]{display:flex}
  .menu a{padding:.8rem 1rem; border-radius:9px}
  .tombol-menu{display:block}
}

/* ===================================================================
   HERO
   =================================================================== */
.hero{
  position:relative; background:var(--hitam); color:#fff; overflow:hidden;
  padding-top:clamp(6.5rem,14vw,9rem); padding-bottom:clamp(2.5rem,6vw,4rem);
}
.hero-isi{display:grid; grid-template-columns:1.25fr .75fr; gap:clamp(2rem,5vw,4rem); align-items:center}
.hero-tempat{
  font-family:var(--sans); font-size:.8rem; font-weight:600; font-stretch:108%;
  letter-spacing:.11em; color:var(--tosca-muda); display:flex; align-items:center; gap:.6rem;
  margin:0 0 1.4rem;
}
.hero-tempat::before{content:""; width:34px; height:2px; background:var(--merah); flex:none}
.nama{
  font-family:var(--sans); font-weight:800; font-stretch:112%;
  font-size:clamp(2.9rem,10.2vw,6.6rem); line-height:.92;
  letter-spacing:-.028em; margin:0;
}
.nama span{display:block}
.nama span:last-child{color:var(--tosca); margin-left:.06em}
.hero-kalimat{
  max-width:46ch; margin:1.7rem 0 0; font-size:1.115rem; line-height:1.68;
  color:rgba(255,255,255,.8);
}
.hero-aksi{display:flex; flex-wrap:wrap; gap:.75rem; margin-top:2.1rem}
.tombol{
  font-family:var(--sans); font-size:.9rem; font-weight:600; font-stretch:106%;
  text-decoration:none; padding:.85rem 1.5rem; border-radius:999px;
  display:inline-block; transition:transform .18s ease, background .2s ease, color .2s ease;
}
.tombol--isi{background:var(--tosca); color:#04100F}
.tombol--isi:hover{background:var(--tosca-muda); transform:translateY(-2px)}
.tombol--garis{border:1px solid rgba(255,255,255,.32); color:#fff}
.tombol--garis:hover{border-color:var(--tosca); color:var(--tosca-muda); transform:translateY(-2px)}

/* potret + ukiran */
.hero-potret{position:relative; align-self:center; max-width:380px; margin-left:auto; width:100%}
.hero-potret img.potret{
  width:100%; height:auto; position:relative; z-index:2;
  mask-image:linear-gradient(to bottom,#000 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent 100%);
  filter:drop-shadow(0 0 3px rgba(0,0,0,.85)) drop-shadow(0 14px 26px rgba(0,0,0,.5));
  animation:naik 1.1s cubic-bezier(.2,.7,.3,1) .25s both;
}
.ukiran{
  position:absolute; z-index:1; left:50%; top:36%;
  width:min(172%,600px); height:auto; pointer-events:none; opacity:.92;
  transform:translate(-50%,-50%);
  animation:mekar 1.6s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes mekar{
  from{opacity:0; transform:translate(-50%,-50%) scale(.82) rotate(-14deg)}
  to{opacity:.92; transform:translate(-50%,-50%) scale(1) rotate(0)}
}
@keyframes naik{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  .ukiran{animation:none; opacity:.92; transform:translate(-50%,-50%)}
  .hero-potret img.potret{animation:none; opacity:1; transform:none}
}

.ringkas{
  display:flex; flex-wrap:wrap; gap:clamp(1.6rem,5vw,3.4rem);
  margin-top:clamp(2.6rem,6vw,4rem); padding-top:1.7rem;
  border-top:1px solid rgba(255,255,255,.14);
}
.ringkas div{max-width:15rem}
.ringkas b{
  display:block; font-family:var(--sans); font-weight:700; font-stretch:110%;
  font-size:clamp(1.4rem,3vw,1.95rem); color:var(--tosca-muda); line-height:1.1;
}
.ringkas p{margin:.35rem 0 0; font-size:.9rem; color:rgba(255,255,255,.6); line-height:1.5}

@media (max-width:820px){
  .hero-isi{grid-template-columns:1fr}
  .hero-potret{max-width:290px; margin:2rem auto 0}
  .ukiran{width:186%; top:34%}
}

/* ===================================================================
   ORNAMEN UKIR (pembatas antarbagian)
   =================================================================== */
.ukir{display:block; width:100%; height:30px; background-repeat:repeat-x; background-position:center; background-size:auto 30px}
.ukir--terang{background-color:var(--kertas)}
.ukir--gelap{background-color:var(--hitam)}

/* ===================================================================
   BAGIAN UMUM
   =================================================================== */
section[id]{scroll-margin-top:4.5rem}
.bagian{padding-block:var(--ruang)}
.bagian--kertas{background:var(--kertas)}
.bagian--gelap{background:var(--hitam); color:#fff}
.judul{
  font-family:var(--sans); font-weight:700; font-stretch:108%;
  font-size:clamp(1.85rem,4.4vw,2.95rem); line-height:1.05;
  letter-spacing:-.02em; margin:0 0 .9rem;
}
.pengantar{max-width:56ch; margin:0 0 clamp(2.2rem,5vw,3.2rem); color:rgba(5,10,10,.66); font-size:1.06rem}
.bagian--gelap .pengantar{color:rgba(255,255,255,.62)}

/* --- Tentang --- */
.tentang-tata{display:grid; grid-template-columns:1.5fr .8fr; gap:clamp(2rem,6vw,4.5rem); align-items:start}
.prosa p{max-width:66ch; margin:0 0 1.25rem}
.prosa p:first-child{
  font-size:1.22rem; line-height:1.62; color:var(--tosca-tua);
}
.fakta{border-top:2px solid var(--hitam)}
.fakta div{padding:.95rem 0; border-bottom:1px solid rgba(5,10,10,.13)}
.fakta dt{
  font-family:var(--sans); font-size:.73rem; font-weight:600; font-stretch:106%;
  letter-spacing:.1em; color:var(--tosca-tua); margin-bottom:.2rem;
}
.fakta dd{margin:0; font-size:1rem}
@media (max-width:820px){.tentang-tata{grid-template-columns:1fr}}

/* --- Kajian --- */
.kajian-tata{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(1.5rem,4vw,2.6rem)}
.kajian-tata article{padding-top:1.4rem; border-top:2px solid var(--tosca)}
.kajian-tata h3{
  font-family:var(--sans); font-weight:700; font-stretch:106%; font-size:1.28rem;
  margin:.5rem 0 .55rem; letter-spacing:-.01em;
}
.kajian-tata p{margin:0; color:rgba(5,10,10,.72); font-size:1rem}
.ikon-ukir{width:30px; height:30px}
@media (max-width:820px){.kajian-tata{grid-template-columns:1fr}}

/* --- Karya --- */
.karya-unggulan{display:grid; grid-template-columns:1fr 1fr; gap:clamp(1.4rem,4vw,2.4rem); margin-bottom:clamp(2.4rem,6vw,3.6rem)}
.kartu{
  background:var(--hitam); color:#fff; padding:clamp(1.6rem,3.6vw,2.3rem);
  border-radius:3px; display:flex; flex-direction:column; position:relative; overflow:hidden;
}
.kartu::after{
  content:""; position:absolute; right:-40px; bottom:-40px; width:150px; height:150px;
  border:1px solid rgba(139,227,221,.22); border-radius:50%;
}
.kartu-meta{
  font-family:var(--sans); font-size:.74rem; font-weight:600; font-stretch:106%;
  letter-spacing:.09em; color:var(--tosca-muda); margin-bottom:.9rem;
  display:flex; align-items:center; gap:.7rem;
}
.kartu-meta i{font-style:normal; color:rgba(255,255,255,.45); font-weight:500}
.kartu-meta i::before{content:""; display:inline-block; width:16px; height:1px; background:var(--merah); vertical-align:middle; margin-right:.7rem}
.kartu h3{font-family:var(--sans); font-weight:700; font-stretch:104%; font-size:clamp(1.3rem,2.6vw,1.72rem); line-height:1.17; margin:0 0 .85rem; letter-spacing:-.015em}
.kartu p{margin:0 0 1.4rem; color:rgba(255,255,255,.72); font-size:.995rem}
.kartu .penerbit{font-family:var(--sans); font-size:.8rem; color:rgba(255,255,255,.5); margin-top:auto}
.pranala{
  font-family:var(--sans); font-size:.86rem; font-weight:600; color:var(--tosca-muda);
  text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:2px;
  align-self:flex-start; margin-bottom:1.3rem;
}
.pranala:hover{color:#fff}

.daftar-karya{border-top:1px solid rgba(5,10,10,.16)}
.baris{
  display:grid; grid-template-columns:5.5rem 1fr auto; gap:1.2rem; align-items:baseline;
  padding:1.5rem 0; border-bottom:1px solid rgba(5,10,10,.16);
}
.baris .thn{font-family:var(--sans); font-weight:700; font-stretch:104%; color:var(--tosca-tua); font-size:.95rem}
.baris h3{font-family:var(--sans); font-weight:600; font-stretch:102%; font-size:1.11rem; line-height:1.32; margin:0 0 .4rem}
.baris .sub{margin:0; font-size:.94rem; color:rgba(5,10,10,.62)}
.baris .buka{
  font-family:var(--sans); font-size:.82rem; font-weight:600; color:var(--tosca-tua);
  text-decoration:none; white-space:nowrap; border-bottom:1px solid currentColor;
}
.baris .buka:hover{color:var(--merah)}
@media (max-width:820px){
  .karya-unggulan{grid-template-columns:1fr}
  .baris{grid-template-columns:1fr; gap:.35rem}
}

/* --- Perjalanan --- */
.perjalanan-tata{display:grid; grid-template-columns:.9fr 1.35fr; gap:clamp(2rem,6vw,5rem); align-items:start}
.perjalanan-kepala{position:sticky; top:5.5rem}
.perjalanan-kepala .pengantar{margin-bottom:0}
@media (max-width:820px){
  .perjalanan-tata{grid-template-columns:1fr}
  .perjalanan-kepala{position:static; margin-bottom:2.5rem}
}
.garis{position:relative; padding-left:2.4rem}
.garis::before{content:""; position:absolute; left:6px; top:.6rem; bottom:.6rem; width:1px; background:rgba(255,255,255,.22)}
.garis li{position:relative; list-style:none; padding-bottom:2.5rem}
.garis li:last-child{padding-bottom:0}
.garis li::before{
  content:""; position:absolute; left:-2.4rem; top:.55rem; width:13px; height:13px;
  background:var(--tosca); transform:rotate(45deg);
}
.garis .thn{font-family:var(--sans); font-weight:700; font-stretch:108%; font-size:.85rem; letter-spacing:.08em; color:var(--kuning)}
.garis h3{font-family:var(--sans); font-weight:700; font-stretch:104%; font-size:1.22rem; margin:.3rem 0 .5rem}
.garis p{margin:0; color:rgba(255,255,255,.7); max-width:60ch; font-size:1rem}

/* --- Galeri --- */
.galeri-tata{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(.8rem,2.5vw,1.5rem)}
.galeri-tata figure{margin:0; position:relative}
.galeri-tata img{width:100%; aspect-ratio:3/4; object-fit:cover; background:var(--hitam); display:block; filter:grayscale(.28); transition:filter .35s ease, transform .5s ease}
.galeri-tata figure:hover img{filter:grayscale(0)}
.galeri-tata figcaption{
  font-family:var(--sans); font-size:.78rem; letter-spacing:.05em;
  padding:.7rem .2rem 0; color:rgba(5,10,10,.6);
}
@media (max-width:620px){.galeri-tata{grid-template-columns:1fr 1fr}}

/* --- Kontak --- */
.surel{
  font-family:var(--sans); font-weight:700; font-stretch:100%;
  font-size:clamp(1.35rem,5.2vw,3rem); line-height:1.1; letter-spacing:-.025em;
  color:#fff; text-decoration:none; display:inline-block;
  border-bottom:2px solid var(--tosca); padding-bottom:.15em; word-break:break-word;
}
.surel:hover{color:var(--tosca-muda)}
.tautan-luar{display:flex; flex-wrap:wrap; gap:.6rem; margin-top:2.6rem}
.tautan-luar a{
  font-family:var(--sans); font-size:.87rem; font-weight:500; text-decoration:none;
  color:rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.24);
  padding:.6rem 1.1rem; border-radius:999px; transition:.2s;
}
.tautan-luar a:hover{background:var(--tosca); color:#04100F; border-color:var(--tosca)}
.kota{font-family:var(--sans); font-size:.88rem; color:rgba(255,255,255,.55); margin-top:1.6rem}

/* --- Footer --- */
.kaki{
  background:var(--hitam); color:rgba(255,255,255,.45); font-family:var(--sans); font-size:.83rem;
  padding:2.2rem var(--pad); display:flex; flex-wrap:wrap; gap:1rem; justify-content:space-between;
  border-top:1px solid rgba(255,255,255,.1);
}
.kaki a{color:rgba(255,255,255,.6)}

/* ===================================================================
   PANEL EDITOR
   =================================================================== */
.sunting-buka{
  position:fixed; right:1rem; bottom:1rem; z-index:150; display:none;
  background:var(--tosca); color:#04100F; border:0; cursor:pointer;
  font-family:var(--sans); font-weight:700; font-size:.85rem;
  padding:.8rem 1.2rem; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.3);
}
.sunting-buka[data-tampil="ya"]{display:block}
.panel{
  position:fixed; inset:0 0 0 auto; width:min(460px,100%); z-index:160;
  background:#0B1514; color:#fff; transform:translateX(100%); transition:transform .3s ease;
  display:flex; flex-direction:column; font-family:var(--sans); font-size:.9rem;
}
.panel[data-buka="ya"]{transform:none}
.panel-atas{display:flex; align-items:center; gap:.6rem; padding:1rem 1.1rem; border-bottom:1px solid rgba(255,255,255,.14)}
.panel-atas strong{font-size:1rem; margin-right:auto}
.panel-atas button{background:none; border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:7px; padding:.4rem .7rem; cursor:pointer; font-family:inherit; font-size:.8rem}
.panel-isi{overflow-y:auto; padding:1rem 1.1rem 2rem; flex:1}
.panel-bawah{display:flex; gap:.6rem; padding:.9rem 1.1rem; border-top:1px solid rgba(255,255,255,.14); background:#08100F}
.panel-bawah button{flex:1; border:0; border-radius:9px; padding:.75rem; cursor:pointer; font-family:inherit; font-weight:700; font-size:.85rem}
.pb-simpan{background:var(--tosca); color:#04100F}
.pb-unduh{background:rgba(255,255,255,.14); color:#fff}
.panel details{border:1px solid rgba(255,255,255,.13); border-radius:10px; margin-bottom:.6rem; background:rgba(255,255,255,.03)}
.panel summary{cursor:pointer; padding:.7rem .85rem; font-weight:700; font-size:.88rem; list-style:none}
.panel summary::-webkit-details-marker{display:none}
.panel summary::before{content:"▸ "; color:var(--tosca)}
.panel details[open] > summary::before{content:"▾ "}
.panel .badan{padding:0 .85rem .85rem}
.panel label{display:block; margin-bottom:.75rem}
.panel label span{display:block; font-size:.74rem; color:var(--tosca-muda); margin-bottom:.25rem; letter-spacing:.03em}
.panel input[type=text],.panel textarea{
  width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15);
  color:#fff; border-radius:8px; padding:.55rem .65rem; font-family:inherit; font-size:.87rem; line-height:1.5;
}
.panel textarea{resize:vertical; min-height:4.5rem}
.panel .item{border-left:2px solid var(--tosca); padding-left:.7rem; margin-bottom:.9rem}
.panel .hapus{background:rgba(178,58,46,.25); border:1px solid rgba(178,58,46,.5); color:#FFC9C4; font-size:.74rem; padding:.3rem .6rem; border-radius:6px; cursor:pointer; font-family:inherit}
.panel .tambah{background:rgba(18,166,160,.2); border:1px solid rgba(18,166,160,.5); color:var(--tosca-muda); font-size:.78rem; padding:.45rem .8rem; border-radius:7px; cursor:pointer; font-family:inherit; margin-bottom:.6rem}
.panel .catatan{font-size:.76rem; color:rgba(255,255,255,.5); line-height:1.55; margin:0 0 1rem}
.tirai{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:155; display:none}
.tirai[data-buka="ya"]{display:block}
</style>
</head>

<body>
<a class="lompat" href="#tentang">Lompat ke isi</a>

<header class="puncak" id="puncak">
  <a class="tanda" href="#beranda">
    <img src="logo-krb.png" alt="Logo KRB">
    <span id="tanda-teks">KRB</span>
  </a>
  <button class="tombol-menu" id="tombol-menu" aria-expanded="false" aria-controls="menu">Menu</button>
  <nav class="menu" id="menu" aria-label="Navigasi utama"></nav>
</header>

<main id="isi"></main>

<noscript>
  <div style="padding:8rem 1.5rem 3rem;max-width:44rem;margin:auto">
    <h1>Kiki Reskianto Bugi</h1>
    <p>Penulis esai dan peneliti independen dari Wamena, Papua Pegunungan, yang bekerja
    di persimpangan ontologi, filsafat bahasa, dan logika kritis. Karya-karyanya terbit
    terbuka melalui Zenodo dan terindeks OpenAIRE. Aktifkan JavaScript untuk melihat
    situs selengkapnya.</p>
  </div>
</noscript>

<footer class="kaki" id="kaki"></footer>

<button class="sunting-buka" id="sunting-buka">Sunting isi</button>
<div class="tirai" id="tirai"></div>
<aside class="panel" id="panel" aria-label="Panel penyuntingan isi">
  <div class="panel-atas">
    <strong>Sunting isi situs</strong>
    <button id="panel-tutup">Tutup</button>
  </div>
  <div class="panel-isi" id="panel-isi"></div>
  <div class="panel-bawah">
    <button class="pb-simpan" id="pb-simpan">Terapkan</button>
    <button class="pb-unduh" id="pb-unduh">Unduh data.js</button>
  </div>
</aside>

<script src="data.js"></script>
<script>
/* ===================================================================
   MESIN SITUS. Biasanya tidak perlu diubah.
   Semua isi diambil dari data.js
   =================================================================== */
(function(){
  "use strict";

  var asli = JSON.parse(JSON.stringify(SITE));   // salinan cadangan
  var D = SITE;

  /* --- simpanan sementara di peramban (agar pratinjau tidak hilang) --- */
  function ambilSimpanan(){
    try{
      var s = window.localStorage.getItem("krb-situs");
      if(s) return JSON.parse(s);
    }catch(e){}
    return null;
  }
  function simpan(){
    try{ window.localStorage.setItem("krb-situs", JSON.stringify(D)); }catch(e){}
  }
  var tersimpan = ambilSimpanan();
  if(tersimpan) D = gabung(D, tersimpan);

  function gabung(dasar, baru){
    if(baru === null || baru === undefined) return dasar;
    if(Array.isArray(dasar)) return baru;
    if(typeof dasar === "object"){
      var h = {};
      Object.keys(dasar).forEach(function(k){ h[k] = (k in baru) ? gabung(dasar[k], baru[k]) : dasar[k]; });
      return h;
    }
    return baru;
  }

  var e = function(s){ return String(s === undefined || s === null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };

  /* =================================================================
     ORNAMEN: abstraksi motif ukiran Toraja
     ================================================================= */

  // Ukiran melingkar di belakang potret (pa'barre allo).
  function ukiranBelakang(){
    var b = D.beranda.ukiranBelakang;
    if(!b) return "";
    return '<img class="ukiran" src="'+e(b)+'" alt="" aria-hidden="true" loading="eager">';
  }

  // Pa'tedong: kepala kerbau yang disederhanakan. Penanda tiap bidang kajian.
  function ikonUkir(warna){
    return '<svg class="ikon-ukir" viewBox="0 0 40 40" aria-hidden="true" fill="none" '+
      'stroke="'+warna+'" stroke-width="2" stroke-linejoin="round">'+
      '<path d="M4 12c5-6 10-4 16-4s11-2 16 4"/>'+
      '<path d="M20 10 L30 22 L20 34 L10 22 Z"/>'+
      '<path d="M20 17 L24 22 L20 27 L16 22 Z" fill="'+warna+'" stroke="none"/></svg>';
  }

  // Pembatas antarbagian: deret belah ketupat dan garis, mengikuti pola pa'sussu'.
  function ukir(gelap){
    if(!D.tampilan.ornamenToraja) return "";
    var t = D.tampilan;
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="30" viewBox="0 0 40 30">'+
        '<path d="M20 5 L30 15 L20 25 L10 15 Z" fill="none" stroke="'+t.tosca+'" stroke-width="1.3" opacity="0.6"/>'+
        '<path d="M20 10.5 L24.5 15 L20 19.5 L15.5 15 Z" fill="'+t.merahToraja+'" opacity="0.8"/>'+
        '<path d="M0 15 L10 15 M30 15 L40 15" stroke="'+t.kuningToraja+'" stroke-width="1" opacity="0.5"/>'+
        '<path d="M4 9 L4 21 M36 9 L36 21" stroke="'+t.tosca+'" stroke-width="1" opacity="0.35"/>'+
      '</svg>';
    var uri = "url('data:image/svg+xml," + encodeURIComponent(svg).replace(/'/g,"%27") + "')";
    return '<div class="ukir '+(gelap?"ukir--gelap":"ukir--terang")+'" aria-hidden="true" '+
           'style="background-image:'+uri+'"></div>';
  }

  /* =================================================================
     PENYUSUN HALAMAN
     ================================================================= */
  function pasangWarna(){
    var t = D.tampilan, r = document.documentElement.style;
    r.setProperty("--tosca", t.tosca);
    r.setProperty("--tosca-tua", t.toscaTua);
    r.setProperty("--tosca-muda", t.toscaMuda);
    r.setProperty("--hitam", t.hitam);
    r.setProperty("--putih", t.putih);
    r.setProperty("--kertas", t.kertas);
    r.setProperty("--merah", t.merahToraja);
    r.setProperty("--kuning", t.kuningToraja);
  }

  function pasangKepala(){
    var m = D.meta;
    document.title = m.nama + " | " + m.peran;
    document.documentElement.lang = m.bahasa || "id";
    function set(sel, isi){ var n=document.querySelector(sel); if(n) n.setAttribute("content", isi); }
    set('meta[name="description"]', m.deskripsi);
    set('meta[name="keywords"]', m.kataKunci);
    set('meta[name="author"]', m.nama);
    set('meta[property="og:title"]', m.nama + " | " + m.peran);
    set('meta[property="og:description"]', m.deskripsi);
    if(m.alamatSitus){
      var o=document.querySelector('meta[property="og:url"]');
      if(!o){ o=document.createElement("meta"); o.setAttribute("property","og:url"); document.head.appendChild(o); }
      o.setAttribute("content", m.alamatSitus);
    }
    // Data terstruktur untuk mesin pencari
    var lama = document.getElementById("jsonld"); if(lama) lama.remove();
    var sama = (D.kontak.tautan||[]).filter(function(t){return t.alamat}).map(function(t){return t.alamat;});
    var sk = document.createElement("script");
    sk.type = "application/ld+json"; sk.id = "jsonld";
    sk.textContent = JSON.stringify({
      "@context":"https://schema.org","@type":"Person",
      name:m.nama, jobTitle:m.peran, description:m.deskripsi,
      url:m.alamatSitus || undefined, email:D.kontak.surel || undefined,
      address:{"@type":"PostalAddress", addressLocality:D.kontak.kota},
      knowsAbout:(D.kajian.daftar||[]).map(function(k){return k.nama;}),
      sameAs:sama
    });
    document.head.appendChild(sk);
    document.getElementById("tanda-teks").textContent = m.namaPendek;
  }

  function bangunMenu(){
    document.getElementById("menu").innerHTML =
      (D.menu||[]).map(function(m){ return '<a href="'+e(m.tujuan)+'">'+e(m.teks)+'</a>'; }).join("");
  }

  function bagianHero(){
    var b = D.beranda;
    return '<section class="hero" id="beranda"><div class="batas hero-isi">'+
      '<div><p class="hero-tempat">'+e(b.salam)+'</p>'+
      '<h1 class="nama"><span>'+e(b.judulBaris1)+'</span><span>'+e(b.judulBaris2)+'</span></h1>'+
      '<p class="hero-kalimat">'+e(b.kalimatPembuka)+'</p>'+
      '<div class="hero-aksi">'+
        (b.tombolUtama && b.tombolUtama.teks ? '<a class="tombol tombol--isi" href="'+e(b.tombolUtama.tujuan)+'">'+e(b.tombolUtama.teks)+'</a>' : '')+
        (b.tombolKedua && b.tombolKedua.teks ? '<a class="tombol tombol--garis" href="'+e(b.tombolKedua.tujuan)+'">'+e(b.tombolKedua.teks)+'</a>' : '')+
      '</div></div>'+
      '<div class="hero-potret">'+ukiranBelakang()+
        '<img class="potret" src="'+e(b.fotoUtama)+'" alt="'+e(b.fotoUtamaAlt)+'">'+
      '</div></div>'+
      '<div class="batas"><div class="ringkas">'+
        (b.ringkasan||[]).map(function(r){ return '<div><b>'+e(r.angka)+'</b><p>'+e(r.label)+'</p></div>'; }).join("")+
      '</div></div></section>';
  }

  function bagianTentang(){
    var t = D.tentang;
    return '<section class="bagian" id="tentang"><div class="batas">'+
      '<h2 class="judul">'+e(t.judul)+'</h2>'+
      '<div class="tentang-tata">'+
        '<div class="prosa">'+(t.paragraf||[]).map(function(p){return '<p>'+e(p)+'</p>';}).join("")+'</div>'+
        '<dl class="fakta">'+(t.fakta||[]).map(function(f){
            return '<div><dt>'+e(f.label)+'</dt><dd>'+e(f.isi)+'</dd></div>'; }).join("")+'</dl>'+
      '</div></div></section>';
  }

  function bagianKajian(){
    var k = D.kajian;
    return ukir(false)+'<section class="bagian bagian--kertas" id="kajian"><div class="batas">'+
      '<h2 class="judul">'+e(k.judul)+'</h2><p class="pengantar">'+e(k.pengantar)+'</p>'+
      '<div class="kajian-tata">'+(k.daftar||[]).map(function(x){
        return '<article>'+ikonUkir("var(--tosca-tua)")+'<h3>'+e(x.nama)+'</h3><p>'+e(x.isi)+'</p></article>';
      }).join("")+'</div></div></section>';
  }

  function bagianKarya(){
    var k = D.karya, semua = k.daftar||[];
    var unggul = semua.filter(function(x){return x.unggulan;});
    var sisa = semua.filter(function(x){return !x.unggulan;});
    return '<section class="bagian" id="karya"><div class="batas">'+
      '<h2 class="judul">'+e(k.judul)+'</h2><p class="pengantar">'+e(k.pengantar)+'</p>'+
      (unggul.length ? '<div class="karya-unggulan">'+unggul.map(function(x){
        return '<article class="kartu">'+
          '<p class="kartu-meta">'+e(x.jenis)+'<i>'+e(x.tahun)+'</i></p>'+
          '<h3>'+e(x.judul)+'</h3><p>'+e(x.ringkasan)+'</p>'+
          (x.tautan ? '<a class="pranala" href="'+e(x.tautan)+'" target="_blank" rel="noopener">Baca naskah</a>' : '')+
          '<p class="penerbit">'+e(x.penerbit)+'</p></article>';
      }).join("")+'</div>' : '')+
      (sisa.length ? '<div class="daftar-karya">'+sisa.map(function(x){
        return '<article class="baris"><div class="thn">'+e(x.tahun)+'</div>'+
          '<div><h3>'+e(x.judul)+'</h3><p class="sub">'+e(x.jenis)+', '+e(x.penerbit)+'</p></div>'+
          (x.tautan ? '<a class="buka" href="'+e(x.tautan)+'" target="_blank" rel="noopener">Buka</a>' : '<span></span>')+
          '</article>';
      }).join("")+'</div>' : '')+
      '</div></section>';
  }

  function bagianPerjalanan(){
    var p = D.perjalanan;
    return ukir(true)+'<section class="bagian bagian--gelap" id="perjalanan"><div class="batas">'+
      '<div class="perjalanan-tata"><div class="perjalanan-kepala">'+
      '<h2 class="judul">'+e(p.judul)+'</h2><p class="pengantar">'+e(p.pengantar)+'</p></div>'+
      '<ol class="garis">'+(p.daftar||[]).map(function(x){
        return '<li><div class="thn">'+e(x.tahun)+'</div><h3>'+e(x.judul)+'</h3><p>'+e(x.isi)+'</p></li>';
      }).join("")+'</ol></div></div></section>';
  }

  function bagianGaleri(){
    var g = D.galeri;
    if(!g || !g.aktif) return "";
    return ukir(false)+'<section class="bagian bagian--kertas" id="galeri"><div class="batas">'+
      '<h2 class="judul">'+e(g.judul)+'</h2>'+
      '<div class="galeri-tata">'+(g.daftar||[]).map(function(f){
        return '<figure><img src="'+e(f.berkas)+'" alt="'+e(f.keterangan)+'" loading="lazy">'+
          '<figcaption>'+e(f.keterangan)+'</figcaption></figure>';
      }).join("")+'</div></div></section>';
  }

  function bagianKontak(){
    var k = D.kontak;
    return ukir(true)+'<section class="bagian bagian--gelap" id="kontak"><div class="batas">'+
      '<h2 class="judul">'+e(k.judul)+'</h2><p class="pengantar">'+e(k.pengantar)+'</p>'+
      (k.surel ? '<a class="surel" href="mailto:'+e(k.surel)+'">'+e(k.surel)+'</a>' : '')+
      '<div class="tautan-luar">'+(k.tautan||[]).filter(function(t){return t.alamat;}).map(function(t){
        return '<a href="'+e(t.alamat)+'" target="_blank" rel="noopener">'+e(t.nama)+'</a>';
      }).join("")+'</div>'+
      (k.kota ? '<p class="kota">'+e(k.kota)+'</p>' : '')+
      '</div></section>';
  }

  function bangunKaki(){
    var f = D.footer, kini = new Date().getFullYear();
    var rentang = (f.tahunMulai && String(f.tahunMulai) !== String(kini)) ? f.tahunMulai+"–"+kini : kini;
    document.getElementById("kaki").innerHTML =
      '<span>© '+rentang+' '+e(D.meta.nama)+'</span><span>'+e(f.kalimat)+'</span>';
  }

  function bangun(){
    pasangWarna(); pasangKepala(); bangunMenu();
    document.getElementById("isi").innerHTML =
      bagianHero()+bagianTentang()+bagianKajian()+bagianKarya()+
      bagianPerjalanan()+bagianGaleri()+bagianKontak();
    bangunKaki();
  }

  bangun();

  /* --- perilaku navigasi --- */
  var puncak = document.getElementById("puncak"), menu = document.getElementById("menu"),
      tmenu = document.getElementById("tombol-menu");
  function cekGulir(){ puncak.classList.toggle("puncak--tempel", window.scrollY > 40); }
  cekGulir(); window.addEventListener("scroll", cekGulir, {passive:true});
  tmenu.addEventListener("click", function(){
    var buka = menu.getAttribute("data-buka") === "ya";
    menu.setAttribute("data-buka", buka ? "tidak" : "ya");
    tmenu.setAttribute("aria-expanded", String(!buka));
  });
  menu.addEventListener("click", function(ev){
    if(ev.target.tagName === "A"){ menu.setAttribute("data-buka","tidak"); tmenu.setAttribute("aria-expanded","false"); }
  });

  /* =================================================================
     PANEL PENYUNTINGAN
     Aktif bila alamat diberi ?edit, atau tekan Ctrl+E / Cmd+E
     ================================================================= */
  var panel = document.getElementById("panel"), tirai = document.getElementById("tirai"),
      tombolSunting = document.getElementById("sunting-buka");

  var LABEL = {
    meta:"Identitas dan SEO", beranda:"Halaman depan", tentang:"Tentang saya",
    kajian:"Bidang kajian", karya:"Karya dan publikasi", perjalanan:"Perjalanan",
    galeri:"Galeri", kontak:"Kontak", footer:"Footer", tampilan:"Warna dan tampilan",
    menu:"Menu navigasi",
    nama:"Nama lengkap", namaPendek:"Inisial di kiri atas", peran:"Peran singkat",
    deskripsi:"Deskripsi untuk Google", alamatSitus:"Alamat situs", bahasa:"Kode bahasa",
    kataKunci:"Kata kunci", salam:"Baris lokasi di atas nama",
    judulBaris1:"Judul besar baris 1", judulBaris2:"Judul besar baris 2",
    kalimatPembuka:"Kalimat pembuka", tombolUtama:"Tombol utama", tombolKedua:"Tombol kedua",
    ringkasan:"Angka ringkasan", fotoUtama:"Berkas foto utama", fotoUtamaAlt:"Keterangan foto utama",
    judul:"Judul bagian", pengantar:"Kalimat pengantar", paragraf:"Paragraf",
    fakta:"Kotak fakta", daftar:"Daftar isi", teks:"Teks", tujuan:"Tujuan tautan",
    angka:"Angka", label:"Keterangan", isi:"Isi", ringkasan_:"Ringkasan",
    jenis:"Jenis", tahun:"Tahun", penerbit:"Penerbit", tautan:"Tautan",
    unggulan:"Tampilkan sebagai kartu besar", aktif:"Tampilkan bagian ini",
    berkas:"Berkas gambar", keterangan:"Keterangan", surel:"Alamat surel", kota:"Kota",
    alamat:"Alamat tautan", kalimat:"Kalimat penutup", tahunMulai:"Tahun mulai",
    tosca:"Tosca utama", toscaTua:"Tosca tua", toscaMuda:"Tosca muda",
    hitam:"Hitam", putih:"Putih", kertas:"Latar lembut",
    merahToraja:"Merah ukiran", kuningToraja:"Kuning ukiran",
    ornamenToraja:"Tampilkan ornamen ukiran"
  };
  function labelnya(k){ return LABEL[k] || k; }

  function medan(nilai, jalur){
    var panjang = String(nilai).length > 88 || String(nilai).indexOf("\n") >= 0;
    return panjang
      ? '<textarea data-jalur="'+e(jalur)+'" rows="'+Math.min(9,Math.ceil(String(nilai).length/58)+1)+'">'+e(nilai)+'</textarea>'
      : '<input type="text" data-jalur="'+e(jalur)+'" value="'+e(nilai)+'">';
  }

  function gambarNilai(nilai, jalur, kunci){
    if(typeof nilai === "boolean"){
      return '<label><input type="checkbox" data-jalur="'+e(jalur)+'" '+(nilai?"checked":"")+'> '+e(labelnya(kunci))+'</label>';
    }
    if(typeof nilai === "string" || typeof nilai === "number"){
      return '<label><span>'+e(labelnya(kunci))+'</span>'+medan(nilai, jalur)+'</label>';
    }
    if(Array.isArray(nilai)){
      var isi = nilai.map(function(v,i){
        var dalam = (typeof v === "object")
          ? Object.keys(v).map(function(k){ return gambarNilai(v[k], jalur+"."+i+"."+k, k); }).join("")
          : gambarNilai(v, jalur+"."+i, "Teks");
        return '<div class="item">'+dalam+
          '<button class="hapus" data-hapus="'+e(jalur)+'" data-indeks="'+i+'">Hapus</button></div>';
      }).join("");
      return '<details><summary>'+e(labelnya(kunci))+' ('+nilai.length+')</summary><div class="badan">'+
        isi+'<button class="tambah" data-tambah="'+e(jalur)+'">+ Tambah</button></div></details>';
    }
    if(nilai && typeof nilai === "object"){
      var dalam2 = Object.keys(nilai).map(function(k){ return gambarNilai(nilai[k], jalur+"."+k, k); }).join("");
      return '<details><summary>'+e(labelnya(kunci))+'</summary><div class="badan">'+dalam2+'</div></details>';
    }
    return "";
  }

  function gambarPanel(){
    var html = '<p class="catatan">Perubahan langsung terlihat di halaman setelah menekan '+
      '<b>Terapkan</b>, dan tersimpan sementara di peramban ini. Agar permanen, tekan '+
      '<b>Unduh data.js</b> lalu ganti berkas data.js di GitHub dengan yang baru.</p>';
    html += Object.keys(D).map(function(k){ return gambarNilai(D[k], k, k); }).join("");
    document.getElementById("panel-isi").innerHTML = html;
  }

  function tulisJalur(obj, jalur, nilai){
    var b = jalur.split("."), t = obj;
    for(var i=0;i<b.length-1;i++) t = t[b[i]];
    t[b[b.length-1]] = nilai;
  }
  function bacaJalur(obj, jalur){
    return jalur.split(".").reduce(function(a,k){ return a[k]; }, obj);
  }

  function terapkan(){
    document.querySelectorAll("#panel-isi [data-jalur]").forEach(function(el){
      var nilai = (el.type === "checkbox") ? el.checked : el.value;
      tulisJalur(D, el.getAttribute("data-jalur"), nilai);
    });
    simpan(); bangun(); cekGulir();
  }

  document.getElementById("panel-isi").addEventListener("click", function(ev){
    var t = ev.target;
    if(t.hasAttribute && t.hasAttribute("data-hapus")){
      terapkan();
      bacaJalur(D, t.getAttribute("data-hapus")).splice(+t.getAttribute("data-indeks"), 1);
      simpan(); bangun(); gambarPanel();
    }
    if(t.hasAttribute && t.hasAttribute("data-tambah")){
      terapkan();
      var arr = bacaJalur(D, t.getAttribute("data-tambah"));
      var contoh = arr[0];
      if(typeof contoh === "object" && contoh !== null){
        var baru = {};
        Object.keys(contoh).forEach(function(k){ baru[k] = (typeof contoh[k] === "boolean") ? false : ""; });
        arr.push(baru);
      } else { arr.push(""); }
      simpan(); bangun(); gambarPanel();
    }
  });

  function bukaPanel(b){
    panel.setAttribute("data-buka", b ? "ya" : "tidak");
    tirai.setAttribute("data-buka", b ? "ya" : "tidak");
    if(b) gambarPanel();
  }
  tombolSunting.addEventListener("click", function(){ bukaPanel(true); });
  document.getElementById("panel-tutup").addEventListener("click", function(){ bukaPanel(false); });
  tirai.addEventListener("click", function(){ bukaPanel(false); });
  document.getElementById("pb-simpan").addEventListener("click", function(){ terapkan(); gambarPanel(); });

  document.getElementById("pb-unduh").addEventListener("click", function(){
    terapkan();
    var teks =
      "/* data.js, dihasilkan dari panel penyuntingan pada " +
      new Date().toLocaleString("id-ID") + ".\n" +
      "   Ubah teks di antara tanda kutip lalu simpan. */\n\n" +
      "const SITE = " + JSON.stringify(D, null, 2) + ";\n";
    var b = new Blob([teks], {type:"text/javascript"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "data.js";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });

  // Aktifkan tombol sunting
  if(location.search.indexOf("edit") >= 0){
    tombolSunting.setAttribute("data-tampil","ya");
    bukaPanel(true);
  }
  document.addEventListener("keydown", function(ev){
    if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "e"){
      ev.preventDefault();
      tombolSunting.setAttribute("data-tampil","ya");
      bukaPanel(panel.getAttribute("data-buka") !== "ya");
    }
  });

  // Kembalikan ke isi asli data.js: ketik krbReset() di konsol peramban
  window.krbReset = function(){
    try{ window.localStorage.removeItem("krb-situs"); }catch(err){}
    D = JSON.parse(JSON.stringify(asli));
    bangun(); gambarPanel();
    return "Isi dikembalikan ke data.js.";
  };
})();
</script>
</body>
</html>
